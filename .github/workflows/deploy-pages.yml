name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/design-guide/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build design-guide
        env:
          DEPLOY_TARGET: github-pages
        run: bun run --filter @tooday/design-guide build

      - name: Build web design-system showcase
        env:
          DEPLOY_TARGET: github-pages
        run: bun run --filter @tooday/web build

      - name: Stage web showcase under design-guide output
        run: |
          # web 앱은 /tooday/web 베이스로 빌드되며 /design-system 만 정적 페이지가 필요하다.
          # prerender 단계에서 따라 들어간 인증/리다이렉트 페이지는 배포 대상이 아니므로 정리한다.
          web_pub="apps/web/.output/public"
          rm -rf "$web_pub/index.html" "$web_pub/login" "$web_pub/boards"
          dest="apps/design-guide/.output/public/web"
          mkdir -p "$dest"
          cp -R "$web_pub"/. "$dest"/

      - name: Disable Jekyll processing
        run: touch apps/design-guide/.output/public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/design-guide/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
