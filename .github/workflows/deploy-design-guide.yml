name: Deploy design-guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/design-guide/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-design-guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build design-guide
        env:
          DEPLOY_TARGET: github-pages
        run: bun run --filter @tooday/design-guide build

      - name: Disable Jekyll processing
        run: touch apps/design-guide/.output/public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/design-guide/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
