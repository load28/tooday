# 로컬 개발용 인프라 — 실제 서버가 필요한 것만(PostgreSQL, Redis) 한 번에 띄운다.
# apps/api(러스트)는 PostgreSQL이 필수다 — 개발 전에 `bun run infra:up`으로 띄운다.
# API의 기본 DATABASE_URL이 아래 접속 문자열이라 env 없이 바로 붙는다:
#   DATABASE_URL=postgres://tooday:tooday@localhost:5432/tooday
# Redis는 리프레시 토큰 저장소 opt-in(REDIS_URL 설정)일 때만 필요하다:
#   REDIS_URL=redis://localhost:6379
#
# 사용:  bun run infra:up   /  infra:down  /  infra:logs  /  infra:reset
name: tooday

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tooday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tooday}
      POSTGRES_DB: ${POSTGRES_DB:-tooday}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # BFF가 뜨기 전 DB가 실제로 커넥션을 받는지 확인 — up 시 depends_on 게이트로 쓴다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tooday} -d ${POSTGRES_DB:-tooday}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly로 재시작에도 세션이 살아남는다(Redis 재기동 = 전원 로그아웃 방지).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
