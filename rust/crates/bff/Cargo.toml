[package]
name = "tooday-bff"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tooday_bff"
path = "src/lib.rs"

[[bin]]
name = "tooday-bff"
path = "src/main.rs"

[dependencies]
tooday-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = "0.5"
uuid = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros"] }
